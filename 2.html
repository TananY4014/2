        }
        
        .design-credit a {
            color: #4a90e2;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .design-credit a:hover {
            color: #357abd;
            text-decoration: underline;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
